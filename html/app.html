<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ONG Esperança - SPA com navegacao dinamica, templates e localStorage.">
    <link rel="stylesheet" href="../css/style.css">
    <title>ONG Esperança | SPA</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>ONG Esperança</h1>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">
                Menu
            </button>
            <nav id="menu-principal" aria-label="Navegação principal">
                <a href="#/" data-link>Início</a>
                <a href="#/projetos" data-link>Projetos</a>
                <a href="#/cadastro" data-link>Cadastre-se</a>
            </nav>
        </div>
    </header>

    <main id="app" aria-live="polite"></main>

    <div class="toast-container" aria-live="polite">
        <div id="toastApp" class="toast toast-sucesso" hidden></div>
    </div>

    <div id="modalApp" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalAppTitulo">
            <h3 id="modalAppTitulo">Confirmar participação</h3>
            <p id="modalAppTexto">Deseja ir para o cadastro?</p>
            <div class="modal-acoes">
                <button type="button" id="modalAppCancelar" class="secundario">Cancelar</button>
                <button type="button" id="modalAppConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 ONG Esperança. Projeto acadêmico (SPA).</p>
        </div>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/templates.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/forms.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
